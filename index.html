<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jin's Favorites</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
    onSnapshot, serverTimestamp, query, orderBy, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDBDYyc4odLU0UvlI1xhtrqh5lD68ZpuJM",
    authDomain: "jarada-favorites-f663d.firebaseapp.com",
    projectId: "jarada-favorites-f663d",
    storageBucket: "jarada-favorites-f663d.firebasestorage.app",
    messagingSenderId: "623440893632",
    appId: "1:623440893632:web:f17f87970a2f70493fff25"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const favCol = collection(db, "favorites");

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const nameInput = document.getElementById("nameInput");
  const urlInput = document.getElementById("urlInput");
  const form = document.getElementById("addForm");
  const addDividerBtn = document.getElementById("addDividerBtn");
  const errorEl = document.getElementById("error");

  let items = []; // {id, type: 'link'|'divider', name, url, order, createdAt}
  let pendingEditId = null;

  function normalizeUrl(url) {
    url = url.trim();
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    return url;
  }

  function faviconFor(url) {
    try {
      const u = new URL(url);
      return `https://www.google.com/s2/favicons?sz=64&domain=${u.hostname}`;
    } catch {
      return "";
    }
  }

  async function ensureOrderFields(snapshotDocs) {
    const missing = snapshotDocs.filter(d => d.data().order === undefined);
    if (missing.length === 0) return false;
    const sorted = [...snapshotDocs].sort((a, b) => {
      const ta = a.data().createdAt?.toMillis?.() ?? 0;
      const tb = b.data().createdAt?.toMillis?.() ?? 0;
      return tb - ta;
    });
    const batch = writeBatch(db);
    sorted.forEach((d, i) => batch.update(doc(db, "favorites", d.id), { order: i }));
    await batch.commit();
    return true;
  }

  function render(snapshot) {
    if (snapshot.empty) {
      items = [];
      listEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    ensureOrderFields(snapshot.docs).then((migrated) => {
      if (migrated) return;
      items = snapshot.docs
        .map(d => ({ id: d.id, type: d.data().type || "link", ...d.data() }))
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      drawList();
    });
  }

  function drawList() {
    listEl.innerHTML = "";
    items.forEach((data) => {
      const card = document.createElement("div");
      card.dataset.id = data.id;

      if (data.type === "divider") {
        card.className = "card divider-card";
      } else {
        card.className = "card";
      }

      const handle = document.createElement("div");
      handle.className = "drag-handle";
      handle.textContent = "⠿";
      handle.addEventListener("pointerdown", (e) => startDrag(e, data.id, card));

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "icon-btn";
      editBtn.title = "수정";
      editBtn.textContent = "✎";

      const delBtn = document.createElement("button");
      delBtn.className = "icon-btn del-btn";
      delBtn.title = "삭제";
      delBtn.textContent = "✕";
      delBtn.onclick = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        const label = data.type === "divider" ? `"${data.name}" 구분선` : `"${data.name}"`;
        if (confirm(`${label}을(를) 삭제할까요?`)) {
          await deleteDoc(doc(db, "favorites", data.id));
        }
      };
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      if (data.type === "divider") {
        const dividerColor = data.color || "#8a90a0";
        const label = document.createElement("div");
        label.className = "divider-label";
        label.textContent = data.name;
        label.style.color = dividerColor;
        const line = document.createElement("div");
        line.className = "divider-line";
        line.style.background = dividerColor;

        editBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          openEditDivider(card, data);
        };

        card.appendChild(handle);
        card.appendChild(label);
        card.appendChild(line);
        card.appendChild(actions);
      } else {
        const link = document.createElement("a");
        link.href = data.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.className = "card-link";

        if (data.color) {
          card.style.borderLeft = `4px solid ${data.color}`;
        }

        let icon;
        if (data.icon) {
          icon = document.createElement("span");
          icon.className = "favicon emoji-icon";
          icon.textContent = data.icon;
        } else {
          icon = document.createElement("img");
          icon.src = faviconFor(data.url);
          icon.className = "favicon";
          icon.onerror = () => { icon.style.visibility = "hidden"; };
        }

        const text = document.createElement("div");
        text.className = "card-text";
        const nameEl = document.createElement("div");
        nameEl.className = "card-name";
        nameEl.textContent = data.name;
        const urlEl = document.createElement("div");
        urlEl.className = "card-url";
        urlEl.textContent = data.url.replace(/^https?:\/\//, "");
        text.appendChild(nameEl);
        text.appendChild(urlEl);

        link.appendChild(icon);
        link.appendChild(text);

        editBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          openEdit(card, data);
        };

        card.appendChild(handle);
        card.appendChild(link);
        card.appendChild(actions);
      }

      listEl.appendChild(card);

      if (data.id === pendingEditId) {
        pendingEditId = null;
        if (data.type === "divider") openEditDivider(card, data);
        else openEdit(card, data);
      }
    });
  }

  function openEdit(card, data) {
    card.innerHTML = "";
    card.classList.add("editing");
    card.style.borderLeft = "";

    const editName = document.createElement("input");
    editName.className = "edit-input";
    editName.value = data.name;
    editName.style.flex = "0 0 26%";

    const editUrl = document.createElement("input");
    editUrl.className = "edit-input";
    editUrl.value = data.url;
    editUrl.style.flex = "1";

    const editIcon = document.createElement("input");
    editIcon.className = "edit-input edit-icon";
    editIcon.value = data.icon || "";
    editIcon.placeholder = "아이콘";
    editIcon.maxLength = 2;

    const editColor = document.createElement("input");
    editColor.type = "color";
    editColor.className = "edit-color";
    editColor.value = data.color || "#3b5bdb";
    editColor.title = "색상 띠";

    const clearColorBtn = document.createElement("button");
    clearColorBtn.type = "button";
    clearColorBtn.className = "icon-btn";
    clearColorBtn.title = "색상/아이콘 지우기";
    clearColorBtn.textContent = "↺";
    let clearedColor = false;
    let clearedIcon = false;
    clearColorBtn.onclick = () => {
      clearedColor = true;
      clearedIcon = true;
      editIcon.value = "";
      editColor.value = "#3b5bdb";
    };

    const saveBtn = document.createElement("button");
    saveBtn.className = "save-btn";
    saveBtn.textContent = "저장";
    saveBtn.onclick = async () => {
      const name = editName.value.trim();
      let url = editUrl.value.trim();
      if (!name || !url) return;
      url = normalizeUrl(url);
      const updates = {
        name,
        url,
        icon: clearedIcon ? "" : editIcon.value.trim(),
        color: clearedColor ? "" : editColor.value
      };
      await updateDoc(doc(db, "favorites", data.id), updates);
    };

    const cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel-btn";
    cancelBtn.textContent = "취소";
    cancelBtn.onclick = () => drawList();

    const palette = document.createElement("div");
    palette.className = "emoji-palette";
    const emojiChoices = ["📋","📅","💰","📊","🏫","📁","👨‍🏫","👩‍🏫","📞","✉️","🔑","⚙️","📸","🎨","🧾","📌","🔗","⭐","🚗","🍽️"];
    emojiChoices.forEach((em) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "emoji-choice";
      btn.textContent = em;
      btn.onclick = () => { editIcon.value = em; };
      palette.appendChild(btn);
    });

    card.appendChild(editName);
    card.appendChild(editUrl);
    card.appendChild(editIcon);
    card.appendChild(editColor);
    card.appendChild(clearColorBtn);
    card.appendChild(saveBtn);
    card.appendChild(cancelBtn);
    card.appendChild(palette);
    editName.focus();
    editName.select();
  }

  function openEditDivider(card, data) {
    card.innerHTML = "";
    card.classList.add("editing");

    const editName = document.createElement("input");
    editName.className = "edit-input";
    editName.value = data.name;
    editName.placeholder = "구분선 이름 (예: 일산캠퍼스)";
    editName.style.flex = "1";

    const editColor = document.createElement("input");
    editColor.type = "color";
    editColor.className = "edit-color";
    editColor.value = data.color || "#3b5bdb";

    const saveBtn = document.createElement("button");
    saveBtn.className = "save-btn";
    saveBtn.textContent = "저장";
    saveBtn.onclick = async () => {
      const name = editName.value.trim();
      if (!name) return;
      await updateDoc(doc(db, "favorites", data.id), { name, color: editColor.value });
    };

    const cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel-btn";
    cancelBtn.textContent = "취소";
    cancelBtn.onclick = async () => {
      // 새로 만든 직후 취소하면 빈 이름의 구분선이 남지 않도록 정리
      if (!data.name || data.name === "새 구분선") {
        const current = items.find(it => it.id === data.id);
        if (current && (!current.name || current.name === "새 구분선")) {
          await deleteDoc(doc(db, "favorites", data.id));
          return;
        }
      }
      drawList();
    };

    card.appendChild(editName);
    card.appendChild(editColor);
    card.appendChild(saveBtn);
    card.appendChild(cancelBtn);
    editName.focus();
    editName.select();
  }

  // ---- 드래그로 순서 변경 ----
  function startDrag(e, id, card) {
    e.preventDefault();
    dragCardStart(e, card);
  }

  function dragCardStart(e, card) {
    card.classList.add("dragging");
    card.setPointerCapture(e.pointerId);

    const onMove = (ev) => {
      const y = ev.clientY;
      const siblings = Array.from(listEl.children).filter(c => c !== card);
      let newIndex = siblings.length;
      for (let i = 0; i < siblings.length; i++) {
        const rect = siblings[i].getBoundingClientRect();
        if (y < rect.top + rect.height / 2) {
          newIndex = i;
          break;
        }
      }
      const currentPos = Array.from(listEl.children).indexOf(card);
      if (newIndex !== currentPos) {
        if (newIndex >= siblings.length) {
          listEl.appendChild(card);
        } else {
          listEl.insertBefore(card, siblings[newIndex]);
        }
      }
    };

    const onUp = async (ev) => {
      card.releasePointerCapture(ev.pointerId);
      card.classList.remove("dragging");
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);

      const newOrderIds = Array.from(listEl.children).map(c => c.dataset.id);
      const batch = writeBatch(db);
      newOrderIds.forEach((docId, i) => {
        batch.update(doc(db, "favorites", docId), { order: i });
      });
      await batch.commit();
    };

    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }

  const q = query(favCol, orderBy("createdAt", "desc"));
  onSnapshot(q, render, (err) => {
    errorEl.textContent = "Firebase 연결 오류: " + err.message;
    errorEl.style.display = "block";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    let url = urlInput.value.trim();
    if (!name || !url) return;
    url = normalizeUrl(url);
    try {
      const maxOrder = items.reduce((m, it) => Math.max(m, it.order ?? 0), -1);
      await addDoc(favCol, { type: "link", name, url, order: maxOrder + 1, createdAt: serverTimestamp() });
      nameInput.value = "";
      urlInput.value = "";
      nameInput.focus();
    } catch (err) {
      errorEl.textContent = "저장 오류: " + err.message;
      errorEl.style.display = "block";
    }
  });

  addDividerBtn.addEventListener("click", async () => {
    try {
      const maxOrder = items.reduce((m, it) => Math.max(m, it.order ?? 0), -1);
      const ref = await addDoc(favCol, { type: "divider", name: "새 구분선", color: "#3b5bdb", order: maxOrder + 1, createdAt: serverTimestamp() });
      pendingEditId = ref.id;
    } catch (err) {
      errorEl.textContent = "저장 오류: " + err.message;
      errorEl.style.display = "block";
    }
  });
</script>
<style>

    --navy: #1f2a44;
    --navy-light: #2d3a5c;
    --bg: #f4f5f8;
    --card-bg: #ffffff;
    --border: #e2e4ea;
    --text: #1f2937;
    --text-muted: #8a90a0;
    --accent: #3b5bdb;
    --danger: #e03131;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px 16px 48px;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 10px;
    text-align: center;
  }
  #error {
    display: none;
    max-width: 480px;
    margin: 0 auto 16px;
    background: #fff5f5;
    color: var(--danger);
    border: 1px solid #ffc9c9;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
  }
  #addForm {
    max-width: 480px;
    margin: 0 auto 12px;
    display: flex;
    gap: 8px;
    background: var(--card-bg);
    padding: 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  #addForm input {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }
  #nameInput { flex: 0 0 30%; min-width: 0; }
  #urlInput { flex: 1; min-width: 0; }
  #addForm input:focus { border-color: var(--accent); }
  #addForm button {
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 9px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  #addForm button:hover { background: var(--navy-light); }

  #addDividerBtn {
    background: none;
    border: 1px dashed var(--text-muted);
    color: var(--text-muted);
    border-radius: 9px;
    padding: 0 10px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #addDividerBtn:hover { border-color: var(--accent); color: var(--accent); }

  #list {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 4px 4px 2px;
    touch-action: none;
  }
  .card.dragging {
    opacity: 0.85;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    z-index: 10;
    position: relative;
  }
  .card.editing {
    padding: 8px;
    gap: 6px;
    flex-wrap: wrap;
  }
  .divider-card {
    background: transparent;
    border: none;
    padding: 6px 2px;
    gap: 8px;
  }
  .divider-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .drag-handle {
    color: var(--text-muted);
    font-size: 16px;
    padding: 8px 6px;
    cursor: grab;
    touch-action: none;
    flex-shrink: 0;
    user-select: none;
  }
  .card-link {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
    text-decoration: none;
    color: inherit;
    padding: 8px;
  }
  .favicon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .emoji-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    background: #eef0f5;
  }
  .card-text { min-width: 0; }
  .card-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-url {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-actions {
    display: flex;
    flex-shrink: 0;
  }
  .icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 8px;
  }
  .icon-btn:hover { background: #eef0f5; color: var(--accent); }
  .del-btn:hover { background: #fff0f0; color: var(--danger); }

  .edit-input {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 14px;
    outline: none;

  }

  .edit-icon {
    flex: 0 0 50px;
    text-align: center;
  }
  .emoji-palette {
    flex: 0 0 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding-top: 4px;
  }
  .emoji-choice {
    border: 1px solid var(--border);
    background: var(--bg);

  }
  .emoji-choice:hover { border-color: var(--accent); background: #eef0f5; }

    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 9px;
    cursor: pointer;
    flex-shrink: 0;
    background: none;
  }
  .save-btn, .cancel-btn {
    border: none;
    border-radius: 9px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .save-btn { background: var(--navy); color: white; }
  .save-btn:hover { background: var(--navy-light); }
  .cancel-btn { background: #eef0f5; color: var(--text); }
  .cancel-btn:hover { background: #e2e4ea; }

  #empty {
    display: none;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 40px;
  }
</style>
</head>
<body>
  <h1>⭐ Jin's Favorites</h1>
  <div id="error"></div>
  <form id="addForm">
    <input id="nameInput" type="text" placeholder="이름 (예: 평촌 출결)" required>
    <input id="urlInput" type="text" placeholder="주소 (예: cooldesign81.github.io/...)" required>
    <button type="submit">추가</button>
    <button id="addDividerBtn" type="button">+ 구분선</button>
  </form>
  <div id="list"></div>
  <div id="empty">아직 즐겨찾기가 없어요. 위에서 추가해보세요.</div>
</body>
</html>
