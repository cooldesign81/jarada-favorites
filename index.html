<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자라다 즐겨찾기</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc,
    onSnapshot, serverTimestamp, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDBDYyc4odLU0UvlI1xhtrqh5lD68ZpuJM",
    authDomain: "jarada-favorites-f663d.firebaseapp.com",
    projectId: "jarada-favorites-f663d",
    storageBucket: "jarada-favorites-f663d.firebasestorage.app",
    messagingSenderId: "623440893632",
    appId: "1:623440893632:web:f17f87970a2f70493fff25"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const favCol = collection(db, "favorites");

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const nameInput = document.getElementById("nameInput");
  const urlInput = document.getElementById("urlInput");
  const form = document.getElementById("addForm");
  const errorEl = document.getElementById("error");

  function normalizeUrl(url) {
    url = url.trim();
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    return url;
  }

  function faviconFor(url) {
    try {
      const u = new URL(url);
      return `https://www.google.com/s2/favicons?sz=64&domain=${u.hostname}`;
    } catch {
      return "";
    }
  }

  function render(snapshot) {
    listEl.innerHTML = "";
    if (snapshot.empty) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const card = document.createElement("div");
      card.className = "card";

      const link = document.createElement("a");
      link.href = data.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.className = "card-link";

      const icon = document.createElement("img");
      icon.src = faviconFor(data.url);
      icon.className = "favicon";
      icon.onerror = () => { icon.style.visibility = "hidden"; };

      const text = document.createElement("div");
      text.className = "card-text";
      const nameEl = document.createElement("div");
      nameEl.className = "card-name";
      nameEl.textContent = data.name;
      const urlEl = document.createElement("div");
      urlEl.className = "card-url";
      urlEl.textContent = data.url.replace(/^https?:\/\//, "");
      text.appendChild(nameEl);
      text.appendChild(urlEl);

      link.appendChild(icon);
      link.appendChild(text);

      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.title = "삭제";
      delBtn.textContent = "✕";
      delBtn.onclick = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (confirm(`"${data.name}"을(를) 삭제할까요?`)) {
          await deleteDoc(doc(db, "favorites", docSnap.id));
        }
      };

      card.appendChild(link);
      card.appendChild(delBtn);
      listEl.appendChild(card);
    });
  }

  const q = query(favCol, orderBy("createdAt", "desc"));
  onSnapshot(q, render, (err) => {
    errorEl.textContent = "Firebase 연결 오류: " + err.message + " (firebaseConfig 값을 확인하세요)";
    errorEl.style.display = "block";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    let url = urlInput.value.trim();
    if (!name || !url) return;
    url = normalizeUrl(url);
    try {
      await addDoc(favCol, { name, url, createdAt: serverTimestamp() });
      nameInput.value = "";
      urlInput.value = "";
      nameInput.focus();
    } catch (err) {
      errorEl.textContent = "저장 오류: " + err.message;
      errorEl.style.display = "block";
    }
  });
</script>
<style>
  :root {
    --navy: #1f2a44;
    --navy-light: #2d3a5c;
    --bg: #f4f5f8;
    --card-bg: #ffffff;
    --border: #e2e4ea;
    --text: #1f2937;
    --text-muted: #8a90a0;
    --accent: #3b5bdb;
    --danger: #e03131;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 20px;
    text-align: center;
  }
  #error {
    display: none;
    max-width: 480px;
    margin: 0 auto 16px;
    background: #fff5f5;
    color: var(--danger);
    border: 1px solid #ffc9c9;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
  }
  #addForm {
    max-width: 480px;
    margin: 0 auto 24px;
    display: flex;
    gap: 8px;
    background: var(--card-bg);
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  #addForm input {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  #nameInput { flex: 0 0 30%; min-width: 0; }
  #urlInput { flex: 1; min-width: 0; }
  #addForm input:focus { border-color: var(--accent); }
  #addForm button {
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 9px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  #addForm button:hover { background: var(--navy-light); }

  #list {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 4px 4px 8px;
  }
  .card-link {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
    text-decoration: none;
    color: inherit;
    padding: 8px;
  }
  .favicon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .card-text { min-width: 0; }
  .card-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-url {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .del-btn:hover { background: #fff0f0; color: var(--danger); }

  #empty {
    display: none;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 40px;
  }
</style>
</head>
<body>
  <h1>⭐ 자라다 즐겨찾기</h1>
  <div id="error"></div>
  <form id="addForm">
    <input id="nameInput" type="text" placeholder="이름 (예: 평촌 출결)" required>
    <input id="urlInput" type="text" placeholder="주소 (예: cooldesign81.github.io/...)" required>
    <button type="submit">추가</button>
  </form>
  <div id="list"></div>
  <div id="empty">아직 즐겨찾기가 없어요. 위에서 추가해보세요.</div>
</body>
</html>
